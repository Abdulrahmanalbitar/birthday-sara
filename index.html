<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Happy Birthday!</title>
  
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
  
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

  <!-- Interactive Cursor Particles -->
  <script type="text/javascript">
  var colours = ['#ff4d6d', '#ff758f', '#ff8fa3', '#c9184a', '#a53860', '#ffb3c1']; 
  var minisize = 16; 
  var maxisize = 28; 
  var hearts = 45; 
  var over_or_under = "over"; 

  var x = ox = 400;
  var y = oy = 300;
  var swide = 800;
  var shigh = 600;
  var sleft = sdown = 0;
  var herz = [];
  var herzx = [];
  var herzy = [];
  var herzs = [];

  function addRVLoadEvent(funky) {
    var oldonload = window.onload;
    if (typeof(oldonload) != 'function') window.onload = funky;
    else window.onload = function() {
      if (oldonload) oldonload();
      funky();
    }
  }

  addRVLoadEvent(mwah);

  function mwah() { if (document.getElementById) {
    var i, heart;
    for (i = 0; i < hearts; i++) {
      heart = createDiv("auto", "auto");
      heart.style.visibility = "hidden";
      heart.style.zIndex = "1001";
      heart.style.color = colours[i % colours.length];
      heart.style.pointerEvents = "none";
      heart.style.opacity = 0.75;
      heart.appendChild(document.createTextNode(String.fromCharCode(9829)));
      document.body.appendChild(heart);
      herz[i] = heart;
      herzy[i] = false;
    }
    set_scroll();
    set_width();
    herzle();
  }}

  function herzle() {
    var c;
    if (Math.abs(x - ox) > 1 || Math.abs(y - oy) > 1) {
      ox = x;
      oy = y;
      for (c = 0; c < hearts; c++) if (herzy[c] === false) {
        herz[c].firstChild.nodeValue = String.fromCharCode(9829);
        herz[c].style.left = (herzx[c] = x - minisize / 2) + "px";
        herz[c].style.top = (herzy[c] = y - minisize) + "px";
        herz[c].style.fontSize = minisize + "px";
        herz[c].style.visibility = 'visible';
        herzs[c] = minisize;
        break;
      }
    }
    for (c = 0; c < hearts; c++) if (herzy[c] !== false) blow_heart(c);
    setTimeout(herzle, 40);
  }

  function blow_heart(i) {
    herzy[i] -= herzs[i] / minisize + i % 2;
    herzx[i] += ((i % 5) - 2) / 5;
    if (herzy[i] < sdown - herzs[i] || herzx[i] < sleft - herzs[i] || herzx[i] > sleft + swide - herzs[i]) {
      herz[i].style.visibility = "hidden";
      herzy[i] = false;
    } else {
      herz[i].style.top = herzy[i] + "px";
      herz[i].style.left = herzx[i] + "px";
    }
  }

  document.onmousemove = function(e) {
    if (e) { y = e.pageY; x = e.pageX; }
    else { set_scroll(); y = event.y + sdown; x = event.x + sleft; }
  };

  window.onresize = set_width;
  function set_width() {
    swide = window.innerWidth || document.documentElement.clientWidth || document.body.clientWidth;
    shigh = window.innerHeight || document.documentElement.clientHeight || document.body.clientHeight;
  }

  window.onscroll = set_scroll;
  function set_scroll() {
    sdown = window.pageYOffset || document.documentElement.scrollTop || 0;
    sleft = window.pageXOffset || document.documentElement.scrollLeft || 0;
  }

  function createDiv(height, width) {
    var div = document.createElement("div");
    div.style.position = "absolute";
    div.style.height = height;
    div.style.width = width;
    div.style.overflow = "hidden";
    div.style.backgroundColor = "transparent";
    return div;
  }
  </script>
</head>

<body>
  <div id="wrapper">
    <div class="flag__birthday">
      <img src="./Images/1.png" alt="" width="350" class="flag__left">
      <img src="./Images/1.png" alt="" width="350" class="flag__right">
    </div>

    <div class="content">
      <div class="left">
        <div class="title">
          <h1 class="happy">
            <span style="--t: 1s;">H</span>
            <span style="--t: 1.1s;">a</span>
            <span style="--t: 1.2s;">p</span>
            <span style="--t: 1.3s;">p</span>
            <span style="--t: 1.4s;">y</span>
          </h1>
          <h1 class="birthday">
            <span style="--t: 1.6s;">B</span>
            <span style="--t: 1.7s;">i</span>
            <span style="--t: 1.8s;">r</span>
            <span style="--t: 1.9s;">t</span>
            <span style="--t: 2.0s;">h</span>
            <span style="--t: 2.1s;">d</span>
            <span style="--t: 2.2s;">a</span>
            <span style="--t: 2.3s;">y</span>
          </h1>
          <div class="hat">
            <img src="./Images/hat.png" alt="" width="130">
          </div>
        </div>

        <div class="date__of__birth">
          <span></span>
        </div>

        <div class="btn">
          <button id="btn__letter">
            Open Message 
            <i class="fa-regular fa-envelope"></i>
          </button>
        </div>
      </div>

      <div class="right">
        <div class="box__account">
          <div class="image">
            <img src="./Images/r5.png" alt="Profile">
          </div>
          <!-- ضع اسم الآنسة هنا بدلاً من Miss Name -->
          <div class="name">
            <i class="fa-solid fa-star" style="color: #f10f0f;"></i>
            <span>Eng. Sara Tawami</span>
            <i class="fa-solid fa-star" style="color: #f10f0f;"></i>
          </div>
          <div class="balloon_one">
            <img width="100px" src="./Images/balloon1.png" alt="">
          </div>
          <div class="balloon_two">
            <img width="100px" src="./Images/balloon2.png" alt="">
          </div>
        </div>

        <div class="cricle">
          <div class="text__cricle">
            <span style="--i: 1;">h</span>
            <span style="--i: 2;">a</span>
            <span style="--i: 3;">p</span>
            <span style="--i: 4;">p</span>
            <span style="--i: 5;">y</span>
            <span style="--i: 6;">-</span>
            <span style="--i: 7;">b</span>
            <span style="--i: 8;">i</span>
            <span style="--i: 9;">r</span>
            <span style="--i: 10;">t</span>
            <span style="--i: 11;">h</span>
            <span style="--i: 12;">d</span>
            <span style="--i: 13;">a</span>
            <span style="--i: 14;">y</span>
            <span style="--i: 15;">-</span>
          </div>
          <i class="fa-solid fa-heart"></i>
        </div>
      </div>
    </div>

    <!-- Background Elements -->
    <div class="decorate_star star1" style="--t: 4s;"></div>
    <div class="decorate_star star2" style="--t: 4.2s;"></div>
    <div class="decorate_star star3" style="--t: 4.4s;"></div>
    <div class="decorate_star star4" style="--t: 4.6s;"></div>
    <div class="decorate_star star5" style="--t: 4.8s;"></div>

    <div class="decorate_flower--one" style="--t: 4s;">
      <img width="20" src="./Images/decorate_flower.png" alt="">
    </div>
    <div class="decorate_flower--two" style="--t: 4.3s;">
      <img width="20" src="./Images/decorate_flower.png" alt="">
    </div>
    <div class="decorate_flower--three" style="--t: 4.6s;">
      <img width="20" src="./Images/decorate_flower.png" alt="">
    </div>

    <div class="decorate_bottom">
      <img src="./Images/decorate.png" alt="" width="100">
    </div>
    <div class="smiley__icon">
      <img src="./Images/smiley_icon.png" alt="" width="100">
    </div>

    <!-- Letter Popup Modal -->
    <div class="box__letter">
      <div class="letter__border">
        <div class="letter">
          <div class="title__letter"></div>
          <div class="content__letter">
            <div class="left">
              <img id="heart__letter" src="https://media0.giphy.com/media/c76IJLufpNwSULPk77/giphy.gif" alt="">
              <img class="heart heart_1" style="--t: 0.2s" width="20" src="./Images/heart.png" alt="">
              <img class="heart heart_2" style="--t: 0.4s" width="20" src="./Images/heart.png" alt="">
              <img class="heart heart_3" style="--t: 0.6s" width="20" src="./Images/heart.png" alt="">
              <img class="heart heart_4" style="--t: 0.8s" width="20" src="./Images/heart.png" alt="">
            </div>
            <div class="right">
              <div class="text__letter">
                <p></p>
              </div>
              <img id="mewmew" width="80" src="./Images/mewmew.gif" alt="">
            </div>
          </div>
        </div>
        <div class="close">
          <i class="fa-solid fa-xmark"></i>
        </div>
      </div>
    </div>
  </div>

  <script>
    // 11 Oct 2000
    let datetxt = "11 Oct 2000";
    
    // ضع اسم الآنسة في عنوان الرسالة أو غيّره كما تشاء
    let titleLetter = "To the Wonderful Eng.Sara Tawami";
    
    // نص الرسالة بالإنجليزية (مهذب وراقي ومناسب لمعلمة ساعدتك)
    let datatxtletter = "Happy Birthday! Looking back at where we started, I feel truly lucky to see how beautifully our journey has unfolded. Having you as my teacher was inspiring, but having you today as a wonderful colleague and dear friend is something I genuinely cherish.Thank you for your kindness, constant support, and the positive energy you always bring. Wishing you an extraordinary year filled with new achievements, peace of mind, and endless happiness. Here’s to another wonderful year ahead! ✨🎉";
    
    let charArrDate = datetxt.split('');
    let charArrDateLetter = datatxtletter.split('');
    let charArrTitle = titleLetter.split('');
    
    let currentIndex = 0;
    let currentIndexLetter = 0;
    let currentIndexTitle = 0;
    let date__of__birth = document.querySelector(".date__of__birth span");
    let text__letter = document.querySelector(".text__letter p");
    let timeDatetxt;

    setTimeout(function(){
      timeDatetxt = setInterval(function(){
        if(currentIndex < charArrDate.length){
          date__of__birth.textContent += charArrDate[currentIndex];
          currentIndex++;
        } else {
          let i = document.createElement("i");
          i.className = "fa-solid fa-star";
          i.style.color = "#f1c40f";
          document.querySelector(".date__of__birth").prepend(i);
          document.querySelector(".date__of__birth").appendChild(i.cloneNode(true));
          clearInterval(timeDatetxt);
        }
      }, 90);
    }, 3500);

    var intervalContent;
    var intervalTitle;
    
    $("#btn__letter").on("click", function(){
      $(".box__letter").slideDown();
      setTimeout(function(){
        $(".letter__border").slideDown();
      }, 500);
      
      // Typewriter for Title
      setTimeout(function(){
        intervalTitle = setInterval(function(){
          if(currentIndexTitle < charArrTitle.length){
            document.querySelector(".title__letter").textContent += charArrTitle[currentIndexTitle];
            currentIndexTitle++;
          } else {
            let i = document.createElement("i");
            i.className = "fa-solid fa-heart";
            document.querySelector(".title__letter").appendChild(i);
            clearInterval(intervalTitle);
          }
        }, 70);
      }, 1000);

      // Fade-in animations
      setTimeout(function(){
        document.querySelector("#heart__letter").classList.add("animationOp");
        document.querySelector("#mewmew").classList.add("animationOp");
      }, 1500);

      setTimeout(function(){
        document.querySelectorAll(".heart").forEach((item)=>{
          item.classList.add("animation");
        });
      }, 1800);

      // Typewriter for Letter Text
      setTimeout(function(){
        intervalContent = setInterval(function(){
          if(currentIndexLetter < charArrDateLetter.length){
            text__letter.textContent += charArrDateLetter[currentIndexLetter];
            currentIndexLetter++;
          } else {
            clearInterval(intervalContent);
          }
        }, 35);
      }, 2400);
    });

    // Close button logic
    $(".close").on("click", function(){
      clearInterval(intervalContent);
      clearInterval(intervalTitle);
      document.querySelector(".title__letter").textContent = "";
      text__letter.textContent = "";
      currentIndexLetter = 0;
      currentIndexTitle = 0;
      document.querySelector("#heart__letter").classList.remove("animationOp");
      document.querySelector("#mewmew").classList.remove("animationOp");
      document.querySelectorAll(".heart").forEach((item)=>{
        item.classList.remove("animation");
      });
      $(".box__letter").slideUp();
      $(".letter__border").slideUp();
    });
  </script>
</body>
</html>
